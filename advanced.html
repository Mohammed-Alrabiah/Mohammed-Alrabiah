<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>

        <style>
            #links {
                text-align: right;
                font-size: 18px;
                margin-top:20px;
                width: 300px;
            }

            a{
                
                color:rgb(46, 46, 46);
                margin: 20px;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }

            body{
                font-family:Arial, Helvetica, sans-serif;
            }

            input[type="text"] {
                width: 600px;
                padding: 16px;
                margin: 10px;
                border: 1px solid lightgray;
                height: 6px;
                border-radius: 0px;
                outline: None;
            }

            input[type = "submit"] {
                font-size: 14px;
                padding: 11px;
                border: none;
                border-radius: 4px;
                background-color:rgb(48, 131, 255);
                color: white;
                cursor: pointer;
                border: white 1px solid;
                font-weight:550;

                margin-top: 40px;
                margin-left: 254px;
            }

            input[type = "submit"]:hover {
                border: lightgray 1px solid;
                box-shadow: gray 0px 0px 1px;
            }


            #top_image {
                width: 70px;
                margin: 20px;
            }

            #upper_bar {
                display: flex;
                justify-content: space-between;
            }

            h5 {
                margin-left: 20px;
                font-size: 24px;
                color:crimson;
                margin-top: 30px;
                margin-left: 40px;
                font-style: normal;
                font-weight: normal;
            }

            hr {
                margin: 0;
                border: 0;
                height: 1px;
                background-color: lightgray;
            }

            h6{
                margin-left: 20px;
                font-size: 20px;
                color:rgb(46, 46, 46);
                margin-top: 30px;
                margin-left: 40px;
                font-style: normal;
                font-weight: normal;
            }

            p{
                margin-left: 20px;
                font-size: 16px;
                color:rgb(46, 46, 46);
                margin-top: 40px;
                margin-left: 40px;
                font-style: normal;
                font-weight: normal;
                width:max-content;
            }

            #input_fields {
                display: flex;
            }

            #text_fields {
                display: flex;
                flex-direction: column;
                margin-left: 20px;
                margin-top: 16px;
            }

        </style>
    </head>
    <body>

        <div id="upper_bar">
            <div id = "top_image"><img src = "google-logo-1.png" height = "30px" alt = "Google Images Logo"></div>
            
        <div id = "links">
            <a href="index.html">Google Search</a>
        </div>
        </div>

        <div>
            <h5>Advanced Search</h5>
        </div>

        <hr>

        <h6>Find pages with...</h6>

        <form action="https://www.google.com/search">
            <div id = "form">

                <div id = "input_fields">
                    <div>
                        <p>all these words:</p>
                        <p>this exact word or phrase:</p>
                        <p>any of these words:</p>
                        <p>none of these words:</p>
                    </div>

                    <div id = "text_fields">
                        <input type="text" name="q">
                        <input type="text" name="as_epq">
                        <input type="text" name="as_oq">
                        <input type="text" name="as_eq">
                    </div>
                </div>


                <div id = "button_div"><input type="submit" value="Advanced Search"></div>
            </div>
            
        </form>
    </body>
</html>
