<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>

        <style>
            #links {
                text-align: right;
                font-size: 18px;
                margin-top:20px;
            }

            a{
                
                color:rgb(46, 46, 46);
                margin: 20px;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }

            body{
                font-family:Arial, Helvetica, sans-serif;
            }

            input[type="text"] {
                width: 600px;
                padding: 16px;
                border: None;
                border-radius: 30px;
                outline: None;
                box-shadow: 0px 0px 10px lightgray;
            }

            input[type = "submit"] {
                margin-top: 10px;
                font-size: 16px;
                padding: 12px;
                border: none;
                border-radius: 4px;
                background-color: rgb(240, 243, 247);
                color: rgb(75, 75, 75);
                cursor: pointer;
                border: white 1px solid;
            }

            input[type = "submit"]:hover {
                border: lightgray 1px solid;
                box-shadow: gray 0px 0px 1px;
            }

            #form {
                height: 80vh;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }

            div#form > div {
                margin: 10px;
            }

            @media (max-width: 750px){
                input[type="text"]{
                    width: 80vw;
                }
            }

        </style>
    </head>
    <body>

        <div id = "links">
            <a href="image.html">Image Search</a>
            <a href="advanced.html">Advanced Search</a>
        </div>


        <form action="https://www.google.com/search">
            <div id = "form">
                <div><img src = "google-logo-1.png" height = "100px" alt = "Google Logo"></div>
                <div><input type="text" name="q"></div>
                <div><input type="submit" value="Google Search"> <input type = "submit" name = "btnI" value = "I'm Feeling Lucky"></div>
            </div>
            
        </form>
    </body>
</html>
